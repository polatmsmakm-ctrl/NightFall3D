name: Nightfall
options:
  bundleIdPrefix: com.rashid
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nightfall:
    type: application
    platform: iOS
    sources:
      - Nightfall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.nightfall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nightfall/Info.plist
