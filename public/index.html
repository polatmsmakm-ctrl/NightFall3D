<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:#050505;color:#d8d2c4;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none}
  canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(ellipse at center,#1a0808 0%,#050505 70%);z-index:10}
  .hidden{display:none!important}
  h1{margin:0;font-size:46px;letter-spacing:6px;color:#b01818;text-shadow:0 0 24px #7a0000,0 0 4px #000;font-weight:800}
  .sub{margin:-8px 0 8px;opacity:.55;font-size:14px}
  input{width:min(300px,86vw);padding:14px;border-radius:10px;border:1px solid #3a1a1a;background:#120a0a;color:#eee;font-size:18px;text-align:center;outline:none}
  input:focus{border-color:#8a1c1c}
  button{padding:14px 28px;border-radius:10px;border:1px solid #6a1414;background:#3a0c0c;color:#f1e6e6;font-size:18px;font-weight:700;min-width:min(300px,86vw)}
  button:active{background:#5a1212}
  button:disabled{opacity:.5}
  button.ghost{background:transparent;border-color:#3a3a3a;color:#aaa}

  .pl{padding:10px 14px;border-radius:8px;background:#140c0c;border:1px solid #2a1818;display:flex;justify-content:space-between}
  #code{font-size:34px;letter-spacing:10px;color:#e8c9a0;direction:ltr}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-size:15px;text-shadow:0 0 6px #000}
  #msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:26px;font-weight:800;color:#ff4a4a;text-shadow:0 0 14px #000;opacity:0;transition:opacity .4s}
  #bar{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);width:200px;height:8px;border-radius:4px;background:#1a1a1a;overflow:hidden;opacity:0}
  #bar i{display:block;height:100%;width:0;background:#e8c9a0}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:rgba(255,255,255,.7);text-shadow:0 0 4px #000,0 0 2px #000;white-space:nowrap;text-align:center}
  .lbl.k{color:#ff5a5a}
  .lbl .rb{display:block;width:44px;height:5px;background:#000;margin:3px auto 0;border-radius:3px;overflow:hidden}
  .lbl .rb i{display:block;height:100%;width:0;background:#7bd88f}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.78) 100%)}
  #terror{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 42%,rgba(160,0,0,.85) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:#b00000}
  #grain{position:fixed;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);pointer-events:none;z-index:3;opacity:.09;background-size:256px 256px;animation:gr .9s steps(6) infinite}
  body.nograin #grain{display:none}
  @keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-18px,12px)}40%{transform:translate(14px,-20px)}60%{transform:translate(-10px,-6px)}80%{transform:translate(22px,16px)}100%{transform:translate(0,0)}}
  #look{position:fixed;right:0;top:0;width:58%;height:100%;z-index:3}
  #joy{position:fixed;left:0;bottom:0;width:42%;height:62%;z-index:6;pointer-events:auto}
  #joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);display:none}
  #joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:none}
  #actBtn{position:fixed;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 32px);width:104px;height:104px;border-radius:50%;z-index:7;min-width:0;padding:0;font-size:18px;background:rgba(120,14,14,.55);border:2px solid rgba(255,80,80,.55);pointer-events:auto}
  .rb2{position:fixed;display:none;z-index:7;min-width:0;padding:0;border-radius:50%;font-size:14px;background:rgba(20,20,24,.55);border:2px solid rgba(255,255,255,.3);color:#ddd;pointer-events:auto;-webkit-user-select:none;user-select:none;touch-action:none}
  #sprBtn{right:calc(env(safe-area-inset-right) + 140px);bottom:calc(env(safe-area-inset-bottom) + 26px);width:76px;height:76px}
  #crBtn{right:calc(env(safe-area-inset-right) + 36px);bottom:calc(env(safe-area-inset-bottom) + 150px);width:68px;height:68px}
  .rb2.on{background:rgba(232,201,160,.35);border-color:#e8c9a0;color:#fff}
  #stam{position:fixed;display:none;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:170px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);z-index:7;overflow:hidden;direction:ltr}
  #stam i{display:block;height:100%;width:100%;background:#e8c9a0;border-radius:3px}
  #stam.exh i{background:#d24a3a}
  #topBtns{position:fixed;top:calc(env(safe-area-inset-top) + 36px);right:12px;z-index:8;display:flex;gap:6px;pointer-events:auto}
  #topBtns button{min-width:0;padding:6px 10px;font-size:14px;background:rgba(0,0,0,.45);border-color:#333;color:#bbb}
  #endBox{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font-size:30px;font-weight:800;text-align:center;gap:10px}
  #endBox small{font-size:16px;font-weight:400;opacity:.7}

<script>
(function () {
  window.__nfReady = false;
  function fail(msg) {
    if (window.__nfReady) return;
    var e = document.getElementById('err');
    if (e) e.textContent = 'نسخة 3D ما اشتغلت على جهازك' + (msg ? ' (' + msg + ')' : '') + '';
    var j = document.getElementById('joinBtn'); if (j) j.textContent = 'تعذّر تحميل 3D';
    var c = document.getElementById('classicBtn'); if (c) { c.style.fontSize = '17px'; c.style.background = '#3a0c0c'; c.style.color = '#fff'; }
  }
  window.addEventListener('error', function (ev) { fail(String(ev.message || '').slice(0, 90)); });
  window.addEventListener('unhandledrejection', function (ev) { fail(String((ev.reason && ev.reason.message) || ev.reason).slice(0, 90)); });
  setTimeout(function () { fail('انتهت المهلة'); }, 12000);
})();
</script>

<script type="module">
import * as THREE from '/vendor/three.module.js';
import { GLTFLoader } from '/vendor/GLTFLoader.js';
import * as SkeletonUtils from '/vendor/SkeletonUtils.js';

const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const cv = $('cv');
let W = innerWidth, H = innerHeight;

// ================= الصوت (كله مولّد بالكود، بدون ملفات) =================
const Snd = (() => {
  let ac = null, master = null, started = false, muted = false;
  let nextBeat = 0, nextSting = 0;
  const noiseBuf = () => {
    const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  };
  function start() {
    if (started) { if (ac.state === 'suspended') ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ac.destination);
    started = true;

    // طنين عميق مرعب
    const drone = ac.createGain(); drone.gain.value = 0.11;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; lp.Q.value = 4;
    [[41.2, 'sawtooth'], [41.9, 'sawtooth'], [82.6, 'triangle'], [123.6, 'sine']].forEach(([f, t], i) => {
      const o = ac.createOscillator(); o.type = t; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = i === 3 ? 0.25 : 1;
      o.connect(g).connect(lp); o.start();
      // تأرجح بطيء
      const l = ac.createOscillator(), lg = ac.createGain();
      l.frequency.value = 0.04 + i * 0.03; lg.gain.value = f * 0.012; l.connect(lg).connect(o.frequency); l.start();
    });
    const lfo = ac.createOscillator(), lfoG = ac.createGain();
    lfo.frequency.value = 0.07; lfoG.gain.value = 90; lfo.connect(lfoG).connect(lp.frequency); lfo.start();
    lp.connect(drone).connect(master);

    // ريح
    const ns = ac.createBufferSource(); ns.buffer = noiseBuf(); ns.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.7;
    const wg = ac.createGain(); wg.gain.value = 0.035;
    const wl = ac.createOscillator(), wlg = ac.createGain(); wl.frequency.value = 0.11; wlg.gain.value = 0.025;
    wl.connect(wlg).connect(wg.gain); wl.start();
    const wf = ac.createOscillator(), wfg = ac.createGain(); wf.frequency.value = 0.05; wfg.gain.value = 260;
    wf.connect(wfg).connect(bp.frequency); wf.start();
    ns.connect(bp).connect(wg).connect(master); ns.start();
    nextSting = ac.currentTime + 6;
  }
  function env(g, t, a, d, peak) {
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, t, dur, peak, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, Math.min(0.03, dur / 4), dur, peak);
    o.connect(g).connect(dest || master); o.start(t); o.stop(t + dur + 0.1);
    return o;
  }
  function noiseBurst(t, dur, peak, f, q, type) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf();
    const fl = ac.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    const g = ac.createGain(); env(g, t, 0.01, dur, peak);
    s.connect(fl).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.1);
  }
  // مؤثرات مفاجئة عشوائية
  function sting() {
    const t = ac.currentTime + 0.05, r = Math.random();
    if (r < 0.34) { // صرير شبحي نازل
      const o = tone('sine', 1500 + Math.random() * 500, 380, t, 3.2, 0.05);
      const v = ac.createOscillator(), vg = ac.createGain(); v.frequency.value = 6; vg.gain.value = 22; v.connect(vg).connect(o.frequency); v.start(t); v.stop(t + 3.5);
    } else if (r < 0.67) { // دقة ثقيلة بعيدة
      tone('sine', 62, 28, t, 1.6, 0.5); noiseBurst(t, 0.5, 0.12, 120, 1, 'lowpass');
    } else { // صرير خشب/باب
      const s = ac.createBufferSource(); s.buffer = noiseBuf();
      const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 18;
      fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(900 + Math.random() * 500, t + 1.8);
      const g = ac.createGain(); env(g, t, 0.4, 1.4, 0.16);
      s.connect(fl).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + 2);
    }
  }
  function vol(dist, max) { return Math.max(0, 1 - dist / max); }
  return {
    start,
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.9; return muted; },
    tick(dTerror, isSurvivor) {
      if (!started || muted) return;
      const now = ac.currentTime;
      if (now > nextSting) { sting(); nextSting = now + 9 + Math.random() * 16; }
      // نبض القلب يقوى كل ما اقترب القاتل
      if (isSurvivor && dTerror < 520) {
        const k = 1 - dTerror / 520;
        if (now > nextBeat) {
          const p = 0.25 + k * 0.7;
          tone('sine', 58, 34, now, 0.16, p); tone('sine', 52, 30, now + 0.2, 0.2, p * 0.85);
          nextBeat = now + 1.25 - k * 0.65;
        }
      }
    },
    hit(d, down) { if (!started) return; const v = vol(d, 700); if (v <= 0) return; const t = ac.currentTime;
      noiseBurst(t, 0.18, 0.5 * v, 700, 0.8); tone('sine', 90, 40, t, 0.3, 0.7 * v);
      tone('sawtooth', down ? 820 : 620, down ? 240 : 380, t, down ? 1.1 : 0.55, 0.22 * v); },
    kill(d) { if (!started) return; const v = vol(d, 900); if (v <= 0) return; const t = ac.currentTime;
      tone('sine', 70, 26, t, 1.2, 0.9 * v); noiseBurst(t, 0.6, 0.4 * v, 300, 0.7); tone('sawtooth', 900, 180, t, 1.6, 0.25 * v); },
    swing(d) { if (!started) return; const v = vol(d, 500); if (v <= 0) return; noiseBurst(ac.currentTime, 0.22, 0.3 * v, 1400, 0.9); },
    gen(d) { if (!started) return; const v = Math.max(0.35, vol(d, 1400)); const t = ac.currentTime;
      for (let i = 0; i < 4; i++) tone('square', 220 + i * 3, 200, t + i * 0.16, 0.5, 0.1 * v);
      tone('sine', 110, 55, t, 1.4, 0.4 * v); },
    exit() { if (!started) return; const t = ac.currentTime;
      tone('sawtooth', 110, 98, t, 3.8, 0.28); tone('sawtooth', 165, 147, t, 3.8, 0.18); noiseBurst(t, 3, 0.1, 200, 0.5); },
    escape() { if (!started) return; const t = ac.currentTime; tone('triangle', 330, 660, t, 0.8, 0.25); tone('triangle', 495, 990, t + 0.1, 0.8, 0.18); },
    revive() { if (!started) return; const t = ac.currentTime; tone('sine', 200, 400, t, 0.6, 0.25); },
  };
})();


// ================= فحص الدعم + المصيّر =================
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('err').textContent = 'جهازك ما يدعم WebGL';
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.type = THREE.PCFShadowMap;

const { W: MW, H: MH, walls, gens: GENS, exits: EXITS } = MAP;

// ================= مولّد أرقام ثابت + تكستشرات مولّدة بالكود =================
const rnd = (() => { let s = 20241014; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function mkTex(size, paint) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  paint(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const groundTex = mkTex(512, (g, S) => {
  g.fillStyle = '#383629'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 6000; i++) {
    const a = .05 + rnd() * .14, r = rnd();
    g.fillStyle = r < .42 ? `rgba(58,82,46,${a})` : r < .7 ? `rgba(18,16,12,${a * 1.5})` : `rgba(104,92,70,${a})`;
    g.fillRect(rnd() * S, rnd() * S, 1 + rnd() * 3, 1 + rnd() * 4);
  }
  for (let i = 0; i < 46; i++) {
    const x = rnd() * S, y = rnd() * S, r = 22 + rnd() * 60, gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rnd() < .5 ? 'rgba(12,18,10,.38)' : 'rgba(80,66,44,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});
groundTex.repeat.set(6400 / 320, 5400 / 320);

const wallTex = mkTex(256, (g, S) => {
  g.fillStyle = '#7a766c'; g.fillRect(0, 0, S, S);
  const bh = 32;
  for (let y = 0, row = 0; y < S; y += bh, row++) {
    for (let x = (row % 2) * 32 - 32; x < S; x += 64) {
      const v = 108 + Math.floor(rnd() * 34);
      g.fillStyle = `rgb(${v},${v - 4},${v - 12})`; g.fillRect(x + 1.5, y + 1.5, 61, bh - 3);
    }
  }
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * .18})`; g.fillRect(rnd() * S, rnd() * S, 1 + rnd() * 2, 1 + rnd() * 5); }
  const gr = g.createLinearGradient(0, S * .55, 0, S);
  gr.addColorStop(0, 'rgba(40,60,30,0)'); gr.addColorStop(1, 'rgba(30,50,22,.55)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 9; i++) { const x = rnd() * S; const gg = g.createLinearGradient(0, 0, 0, S * .6); gg.addColorStop(0, 'rgba(0,0,0,.35)'); gg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gg; g.fillRect(x, 0, 3 + rnd() * 6, S * .6); }
});

// ================= المشهد =================
const BG = 0x040608;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.FogExp2(BG, 0.0023);
const camera = new THREE.PerspectiveCamera(62, W / H, 4, 5000);

const hemi = new THREE.HemisphereLight(0x3a4668, 0x0b0a08, 1.0);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x5b6ca3, 0.7);
moon.position.set(-600, 900, 400);
scene.add(moon);

// فانوس اللاعب: هو اللي يحدد مدى الرؤية
const lamp = new THREE.PointLight(0xffcf99, 1100, 0, 1.2);
lamp.shadow.mapSize.set(512, 512); lamp.shadow.camera.near = 6; lamp.shadow.camera.far = 650; lamp.shadow.bias = -0.002;
scene.add(lamp);
// توهج أحمر حول القاتل
const killerGlow = new THREE.PointLight(0xff1a1a, 2600, 0, 2);
scene.add(killerGlow);

// الأرض
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6400, 5400), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, metalness: 0 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(MW / 2, 0, MH / 2); ground.receiveShadow = true;
scene.add(ground);

// الجدران
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, color: 0x6c685f, roughness: .96, metalness: 0 });
const U = 180;
function wallMesh(x, z, w, d, hgt) {

    const fps = fpsN / ((now - fpsT0) / 1000);
    if (!userChoseQ && fps < 27 && qName !== 'low' && downgraded < 2) {
      downgraded++; applyQuality(ORDER[ORDER.indexOf(qName) - 1], false);
      msg(`خفّضنا الجودة تلقائياً (${Math.round(fps)} إطار/ث)`, 2500, '#e8c9a0');
    }
    fpsN = 0; fpsT0 = now;
  }
}
requestAnimationFrame(frame);

// للاختبار والتشخيص فقط
window.__nf = { renderer, scene, camera, players, dbg: () => pred, get state() { return state; }, applyQuality, get q() { return qName; } };
</script>
