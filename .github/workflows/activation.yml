name: Acquire activation file
on:
  workflow_dispatch: {}
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .alf in Unity container
        run: |
          docker run --rm -v "$PWD:/w" -w /w unityci/editor:ubuntu-6000.3.5f1-base-3 \
            bash -c 'unity-editor -batchmode -nographics -quit -createManualActivationFile -logfile - || true; ls -la *.alf'
      - uses: actions/upload-artifact@v4
        with:
          name: activation-alf
          path: "*.alf"
