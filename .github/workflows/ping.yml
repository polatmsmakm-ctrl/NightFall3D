name: Ping the server (is the in-game update being handed out?)
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Render server for the update
        run: |
          U=https://nightfall3d-server.onrender.com
          for i in 1 2 3; do
            echo "== try $i"; curl -s -m 70 -w "\nHTTP %{http_code} in %{time_total}s\n" "$U/patch.json" && break
          done
          echo "== the pack"
          curl -s -m 120 -o /tmp/p.pck -w "HTTP %{http_code} %{size_download} bytes in %{time_total}s\n" "$U/patches/patch_1.pck"
          sha256sum /tmp/p.pck || true
          echo "== root"
          curl -s -m 30 -w "\nHTTP %{http_code}\n" "$U/" | head -c 300
