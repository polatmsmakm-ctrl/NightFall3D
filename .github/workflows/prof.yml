name: Prof (temporary)
on:
  push:
    branches: ['prof/**']
env:
  GODOT_VERSION: "4.5-stable"
permissions:
  contents: write
jobs:
  prof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import 2>&1 | tail -5 || true
      - name: Prof
        run: |
          timeout 1500 godot --headless --path . res://tools/prof_tmp.tscn 2>&1 | grep -v "^\s*at:" | tee prof.log | tail -80 || true
      - name: Publish
        if: always()
        run: |
          mkdir out && cp prof.log out/ 2>/dev/null || true
          cd out && git init -q -b prof-log && git add -A
          git -c user.name=check -c user.email=check@users.noreply.github.com commit -qm "prof of ${GITHUB_SHA}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prof-log
