name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}
env:
  GODOT_VERSION: "4.5-stable"
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -sL "$BASE/Godot_v${GODOT_VERSION}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          curl -sL "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz" -o tpl.tpz
          TDIR="$HOME/Library/Application Support/Godot/export_templates/4.5.stable"
          mkdir -p "$TDIR"
          unzip -q tpl.tpz -d tplx
          mv tplx/templates/* "$TDIR/"
      - name: Import assets
        run: /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --import || true
      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          # Godot sometimes aborts while quitting after a finished export ("Pure virtual function
          # called"); the project it wrote is complete, so only a missing project or pack fails the step
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/NightFall.xcodeproj || echo "::warning::Godot exited with $? after the export"
          ls build/ios
          test -f build/ios/NightFall.xcodeproj/project.pbxproj
          find build/ios -name "*.pck" | grep -q . || { echo "::error::no .pck exported"; exit 1; }
      - name: Build unsigned archive
        run: |
          cd build/ios
          xcodebuild -project NightFall.xcodeproj -scheme NightFall -configuration Release \
            -sdk iphoneos -arch arm64 -archivePath NightFall.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package IPA
        run: |
          cd build/ios
          mkdir Payload
          cp -R NightFall.xcarchive/Products/Applications/*.app Payload/
          zip -qry Nightfall.ipa Payload
          ls -la Nightfall.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/ios
          SIZE=$(stat -f%z Nightfall.ipa)
          echo "IPA is $SIZE bytes"
          FILES="Nightfall.ipa"
          NOTES="Unsigned IPA for Sideloadly"
          if [ "$SIZE" -gt 2000000000 ]; then
            # GitHub refuses a release file of 2 GB or more: send it in parts, with a one-click joiner
            split -b 1900m Nightfall.ipa Nightfall.ipa.part
            PARTS=$(ls Nightfall.ipa.part*)
            { printf '@echo off\r\ncd /d "%%~dp0"\r\ncopy /b '; first=1; for p in $PARTS; do if [ $first = 0 ]; then printf ' + '; fi; printf '%s' "$p"; first=0; done; printf ' Nightfall.ipa\r\necho Done: Nightfall.ipa is ready for Sideloadly\r\npause\r\n'; } > join_parts_windows.bat
            { printf '#!/bin/sh\ncd "$(dirname "$0")"\ncat '; for p in $PARTS; do printf '%s ' "$p"; done; printf '> Nightfall.ipa\necho Done\n'; } > join_parts_mac.sh
            FILES="$PARTS join_parts_windows.bat join_parts_mac.sh"
            NOTES="The IPA is over GitHub's 2 GB limit, so it comes in parts. Download every Nightfall.ipa.part file and join_parts_windows.bat into one folder, double-click join_parts_windows.bat, then open the Nightfall.ipa it makes in Sideloadly."
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES --title "Latest build" --notes "$NOTES" --target ${{ github.sha }}
