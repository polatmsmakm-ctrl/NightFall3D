name: Build IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Nightfall.xcodeproj \
            -scheme Nightfall \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nightfall.app Payload/
          zip -qry Nightfall.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Nightfall-ipa
          path: ios/Nightfall.ipa

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ios/Nightfall.ipa \
            --title "Nightfall - latest build" \
            --notes "Download Nightfall.ipa and install it with Sideloadly. Build #${{ github.run_number }}"
